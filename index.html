<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Prep Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"],
            display: ["Space Grotesk", "Manrope", "ui-sans-serif", "system-ui", "sans-serif"]
          },
          colors: {
            brand: {
              50: "#eff6ff",
              100: "#dbeafe",
              200: "#bfdbfe",
              500: "#2563eb",
              600: "#1d4ed8",
              700: "#1e40af"
            }
          },
          boxShadow: {
            soft: "0 18px 40px -24px rgba(30, 64, 175, 0.35)"
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply text-slate-900;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[radial-gradient(1100px_600px_at_85%_-20%,#dbeafe_0%,transparent_60%),radial-gradient(900px_480px_at_-15%_15%,#fef3c7_0%,transparent_55%),linear-gradient(180deg,#f8fafc_0%,#eef2ff_100%)]">
  <div class="mx-auto w-full max-w-5xl px-4 pb-10 pt-4 sm:px-6 sm:pt-6 lg:px-8">
    <header class="rounded-3xl border border-white/70 bg-white/90 p-5 shadow-soft backdrop-blur sm:p-6">
      <p class="inline-flex rounded-full bg-brand-100 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-brand-700">Exam Prep</p>
      <h1 id="quiz-title" class="mt-3 font-display text-2xl font-bold leading-tight sm:text-3xl">Загрузка теста...</h1>
      <div class="mt-3 flex flex-col gap-1 text-sm text-slate-700 sm:flex-row sm:items-center sm:gap-4 sm:text-base">
        <p id="quiz-count">Вопросов: 0</p>
        <p id="answered-text" class="font-semibold">Отвечено 0 из 0</p>
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-200">
        <div id="progress-bar" class="h-full w-0 rounded-full bg-brand-500 transition-all duration-300"></div>
      </div>
      <section id="result-summary" hidden class="mt-4 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3">
        <p id="result-score" class="text-base font-bold text-emerald-800 sm:text-lg">0 / 0</p>
        <p id="result-percent" class="text-sm font-semibold text-emerald-700 sm:text-base">0%</p>
      </section>
    </header>

    <section id="loading-state" class="mt-4 space-y-3">
      <div class="animate-pulse rounded-3xl border border-white/70 bg-white/90 p-5 shadow-soft sm:p-6">
        <div class="h-6 w-1/2 rounded bg-slate-200"></div>
        <div class="mt-4 h-4 w-full rounded bg-slate-200"></div>
        <div class="mt-2 h-4 w-4/5 rounded bg-slate-200"></div>
      </div>
      <div class="animate-pulse rounded-3xl border border-white/70 bg-white/90 p-5 shadow-soft sm:p-6">
        <div class="h-4 w-24 rounded bg-slate-200"></div>
        <div class="mt-4 h-4 w-full rounded bg-slate-200"></div>
        <div class="mt-3 h-14 w-full rounded-2xl bg-slate-200"></div>
        <div class="mt-2 h-14 w-full rounded-2xl bg-slate-200"></div>
      </div>
      <div class="animate-pulse rounded-3xl border border-white/70 bg-white/90 p-5 shadow-soft sm:p-6">
        <div class="h-4 w-24 rounded bg-slate-200"></div>
        <div class="mt-4 h-4 w-full rounded bg-slate-200"></div>
        <div class="mt-3 h-14 w-full rounded-2xl bg-slate-200"></div>
        <div class="mt-2 h-14 w-full rounded-2xl bg-slate-200"></div>
      </div>
    </section>

    <section id="error-state" hidden class="mt-4 rounded-3xl border border-rose-200 bg-rose-50 p-5 shadow-soft sm:p-6">
      <h2 class="font-display text-xl font-bold text-rose-700 sm:text-2xl">Не удалось загрузить тест</h2>
      <p id="error-text" class="mt-2 text-sm text-rose-700 sm:text-base">Проверьте путь и корректность JSON.</p>
      <button id="error-retry-btn" class="mt-4 inline-flex min-h-11 items-center justify-center rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-700 active:scale-[0.99] sm:text-base">Попробовать снова</button>
    </section>

    <main id="quiz-state" hidden class="mt-4">
      <section class="sticky top-2 z-30 mb-4 rounded-2xl border border-white/80 bg-white/95 p-3 shadow-soft backdrop-blur sm:p-4">
        <div class="flex flex-col gap-1 text-xs text-slate-600 sm:flex-row sm:items-center sm:justify-between sm:text-sm">
          <p id="sticky-progress" class="font-semibold">Отвечено 0 из 0</p>
          <p id="sticky-seed">Seed: 0</p>
        </div>
        <div class="mt-3 grid gap-2 sm:grid-cols-3">
          <button id="check-btn" disabled class="inline-flex min-h-11 items-center justify-center rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-700 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-brand-600 sm:text-base">Проверить</button>
          <button id="reset-btn" class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-amber-200 hover:bg-amber-50 active:scale-[0.99] sm:text-base">Сброс</button>
          <button id="retry-btn" class="inline-flex min-h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-brand-200 hover:bg-brand-50 active:scale-[0.99] sm:text-base">Новая попытка</button>
        </div>
      </section>

      <form id="questions-form" class="space-y-4" novalidate></form>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
